<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MegaBase Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f6f4;--sf:#fff;--ink:#0b2630;--mu:#3f6068;--ln:#bcd0cc;--gold:#a87000}
@media (prefers-color-scheme:dark){:root{--bg:#061419;--sf:#0d2630;--ink:#f1f8f6;--mu:#a3c0c3;--ln:#1d4552;--gold:#ffd23f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1000px;margin:auto;padding:24px 16px 48px}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;margin:0;line-height:1.15}
h1{font-size:clamp(1.8rem,5vw,2.6rem)}
.lead{color:var(--mu);max-width:62ch;font-weight:500;margin:8px 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--sf);border:2px solid var(--ln);border-radius:12px;padding:18px;color:inherit;text-decoration:none}
.card:hover,.card:focus-visible{border-color:var(--ink);outline:none}
.card h2{font-size:1.25rem;margin-bottom:6px}
.card p{margin:0 0 12px;color:var(--mu);flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tags span{border:1px solid var(--ln);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700}
.open{font-weight:800;color:var(--gold)}
.foot{margin-top:32px;color:var(--mu);font-size:.9rem}
</style></head>
<body><div class="wrap">
<h1>MegaBase Builder</h1>
<p class="lead">Plan Palworld megabase layouts tile by tile. Pick a design below, adjust the sizes to fit your build, and place decor before you build in-game.</p>
<div class="grid" id="grid"></div>
<noscript><p>This page needs JavaScript to list the designs. Open a design directly from the designs folder.</p></noscript>
<p class="foot">Sizes and decor you set are saved in your own browser only. They are not shared with anyone else.</p>
</div>
<script src="designs.js"></script>
<script>
const g=document.getElementById('grid');
const list=(window.MEGABASE_DESIGNS||[]).slice().sort((a,b)=>String(b.added).localeCompare(String(a.added)));
list.forEach(d=>{const a=document.createElement('a');a.className='card';a.href=d.path;
const h=document.createElement('h2');h.textContent=d.name;
const p=document.createElement('p');p.textContent=d.summary;
const t=document.createElement('div');t.className='tags';(d.tags||[]).forEach(x=>{const s=document.createElement('span');s.textContent=x;t.appendChild(s)});
const o=document.createElement('div');o.className='open';o.textContent='Open builder';
a.append(h,p,t,o);g.appendChild(a)});
if(!list.length){g.textContent='No designs yet.'}
</script></body></html>
